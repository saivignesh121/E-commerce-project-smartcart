<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login | SmartCart</title>
    <!-- Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts for better typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-[#4e73df] to-[#36b9cc] min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-white/10 p-6 sm:p-10 transition-all">
        
        <!-- Header / Brand -->
        <div class="text-center mb-8">
            <h1 class="text-xl font-black text-indigo-600 tracking-wider uppercase mb-1">
                SmartCart
            </h1>
            <h2 class="text-2xl font-bold text-slate-800 tracking-tight sm:text-3xl">
                User Login
            </h2>
            <p class="text-sm text-slate-500 mt-2">
                Welcome back! Please enter your account credentials.
            </p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-6 space-y-2">
                    {% for category, message in messages %}
                        <div class="p-4 rounded-xl text-sm font-medium bg-red-50 text-red-700 border border-red-100 text-center">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <form method="POST" action="/user-login" class="space-y-5">

            <!-- Email Group -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                    Email Address
                </label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#4e73df] focus:border-[#4e73df] focus:bg-white transition"
                >
            </div>

            <!-- Password Group -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                    Password
                </label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#4e73df] focus:border-[#4e73df] focus:bg-white transition"
                >
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                class="w-full mt-2 bg-[#4e73df] hover:bg-[#2e59d9] text-white font-semibold py-3 px-4 rounded-xl shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-[#4e73df] focus:ring-offset-2 transition active:scale-[0.99] cursor-pointer text-base"
            >
                Login
            </button>

        </form>

        <!-- Redirection Subfooter Link -->
        <div class="mt-8 pt-5 border-t border-slate-100 text-center text-sm text-slate-500">
            Don't have an account? 
            <div class="mt-1.5">
                <a href="/user-register" class="font-bold text-[#4e73df] hover:text-[#2e59d9] transition hover:underline">
                    Create Account
                </a>
            </div>
        </div>

    </div>

</body>
</html>
