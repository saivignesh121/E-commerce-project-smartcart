<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8 transition-all">
        
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-slate-800 tracking-tight sm:text-3xl">
                Create Account
            </h2>
            <p class="text-sm text-slate-500 mt-2">
                Join us today! Please fill in your details to get started.
            </p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-6 space-y-2">
                    {% for category, message in messages %}
                        <div class="p-4 rounded-lg text-sm font-medium {% if category == 'error' %} bg-red-50 text-red-700 border border-red-200 {% else %} bg-amber-50 text-amber-700 border border-amber-200 {% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="/user-register" class="space-y-5">
            
            <div>
                <label for="name" class="block text-sm font-semibold text-slate-700 mb-1.5">
                    Full Name
                </label>
                <input 
                    type="text" 
                    id="name"
                    name="name" 
                    placeholder="John Doe"
                    required 
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white transition"
                >
            </div>

            <div>
                <label for="email" class="block text-sm font-semibold text-slate-700 mb-1.5">
                    Email Address
                </label>
                <input 
                    type="email" 
                    id="email"
                    name="email" 
                    placeholder="you@example.com"
                    required 
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white transition"
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">
                    Password
                </label>
                <input 
                    type="password" 
                    id="password"
                    name="password" 
                    placeholder="••••••••"
                    required 
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white transition"
                >
            </div>

            <button 
                type="submit" 
                class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-sm hover:shadow focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition active:scale-[0.99] cursor-pointer"
            >
                Register
            </button>
        </form>

        <div class="mt-6 pt-5 border-t border-slate-100 text-center">
            <a href="/user-login" class="text-sm font-medium text-indigo-600 hover:text-indigo-700 transition">
                Already have an account? Sign In
            </a>
        </div>

    </div>

</body>
</html>
