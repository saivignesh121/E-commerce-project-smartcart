{% extends 'base.html' %}
{% block title %}Delivery Address | SmartCart{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-10 px-4 sm:px-6 lg:px-8 w-full flex-grow flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 sm:p-10 w-full">
        
        <div class="border-b border-slate-100 pb-5 mb-6">
            <h2 class="text-2xl font-bold text-slate-800 tracking-tight flex items-center gap-2">
                📍 Delivery Address
            </h2>
            <p class="text-slate-400 text-sm mt-1">Specify your current shipping configuration details to facilitate order transit routing updates.</p>
        </div>

        <form action="/user/save_address" method="POST" class="space-y-5">
            
            <div>
                <label for="fullname" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Full Name</label>
                <input 
                    type="text" 
                    id="fullname" 
                    name="fullname" 
                    placeholder="Enter your full name" 
                    required 
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                />
            </div>

            <div>
                <label for="mobile" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Mobile Number</label>
                <input 
                    type="text" 
                    id="mobile" 
                    name="mobile" 
                    placeholder="10-digit mobile number" 
                    pattern="[0-9]{10}" 
                    title="Please enter a valid 10-digit mobile number" 
                    required 
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                />
            </div>

            <div>
                <label for="address" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Street Address</label>
                <textarea 
                    id="address" 
                    name="address" 
                    placeholder="Flat, House no., Building, Company, Apartment, Street" 
                    required 
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition resize-none min-h-[100px]"
                ></textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label for="city" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">City</label>
                    <input 
                        type="text" 
                        id="city" 
                        name="city" 
                        placeholder="City" 
                        required 
                        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                    />
                </div>
                <div>
                    <label for="state" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">State</label>
                    <input 
                        type="text" 
                        id="state" 
                        name="state" 
                        placeholder="State" 
                        required 
                        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                    />
                </div>
            </div>

            <div>
                <label for="pincode" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Pincode</label>
                <input 
                    type="text" 
                    id="pincode" 
                    name="pincode" 
                    placeholder="6-digit Pincode" 
                    pattern="[0-9]{6}" 
                    title="Please enter a valid 6-digit postal code" 
                    required 
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                />
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm py-3 px-4 rounded-xl shadow-sm hover:shadow transition tracking-wide uppercase cursor-pointer">
                Save Address &amp; Continue
            </button>

        </form>
    </div>
</div>
{% endblock %}
