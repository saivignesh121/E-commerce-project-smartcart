<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Address | SmartCart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ===========================
           NAVBAR
        =========================== */
        .navbar {
            background: #0d6efd;
            padding: 18px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1000;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: white;
        }

        .nav-links {
            display: flex;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 17px;
            transition: .3s;
        }

        .nav-links a:hover {
            color: #ffd43b;
        }

        .menu-toggle {
            display: none;
            color: white;
            font-size: 32px;
            cursor: pointer;
            user-select: none;
        }

        /* ===========================
           FORM LAYOUT ARCHITECTURE
        =========================== */
        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            flex: 1;
        }

        .form-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.06);
            padding: 35px;
            border: 1px solid #e9ecef;
        }

        .form-card h2 {
            font-size: 24px;
            color: #222;
            margin-bottom: 25px;
            border-bottom: 2px solid #f4f6f9;
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #495057;
            margin-bottom: 8px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            background-color: #fff;
            color: #333;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        /* Action Buttons */
        .btn {
            display: block;
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background .2s;
            text-align: center;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.15);
            margin-top: 25px;
        }

        .btn:hover {
            background: #218838;
        }

        /* ===========================
           MOBILE RESPONSIVE STRATEGY
        =========================== */
        @media(max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .logo {
                font-size: 24px;
            }

            .menu-toggle {
                display: block;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                position: absolute;
                top: 68px;
                left: 0;
                background: #0d6efd;
                box-shadow: 0 5px 10px rgba(0,0,0,.15);
            }

            .nav-links.show {
                display: flex;
            }

            .nav-links a {
                margin: 0;
                padding: 16px;
                text-align: center;
                width: 100%;
                border-top: 1px solid rgba(255,255,255,.15);
            }

            .container {
                width: 92%;
                margin: 20px auto;
            }

            .form-card {
                padding: 25px 20px;
            }

            .form-row {
                grid-template-columns: 1fr; /* Stack city, state, and pincode fields vertically on mobile */
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Shared Core Navigation Navbar -->
    <div class="navbar">
        <div class="logo">🛒 SmartCart</div>
        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
        <div class="nav-links" id="navLinks">
            <a href="/user-dashboard">Dashboard</a>
            <a href="/user/products">Products</a>
            <a href="/user/cart">Cart</a>
            <a href="/user/my-orders">Orders</a>
            <a href="/user-logout">Logout</a>
        </div>
    </div>

    <!-- Main Content Canvas Wrapper -->
    <div class="container">
        <div class="form-card">
            <h2>📍 Delivery Address</h2>

            <!-- Secure Route Target Form Execution Grid -->
            <form action="/user/save_address" method="POST">
                
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required />
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="text" id="mobile" name="mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number" required />
                </div>

                <div class="form-group">
                    <label for="address">Street Address</label>
                    <textarea id="address" name="address" placeholder="Flat, House no., Building, Company, Apartment, Street" required></textarea>
                </div>

                <!-- Column-Grid Split for Compact Desktop Fields -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city" placeholder="City" required />
                    </div>
                    <div class="form-group">
                        <label for="state">State</label>
                        <input type="text" id="state" name="state" placeholder="State" required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="pincode">Pincode</label>
                    <input type="text" id="pincode" name="pincode" placeholder="6-digit Pincode" pattern="[0-9]{6}" title="Please enter a valid 6-digit postal code" required />
                </div>

                <button type="submit" class="btn">Save Address &amp; Continue</button>

            </form>
        </div>
    </div>

    <script>
        // Toggle mobile hamburger layout menu drawer navigation overlay
        function toggleMenu() {
            document.getElementById("navLinks").classList.toggle("show");
        }
    </script>
</body>
</html>
