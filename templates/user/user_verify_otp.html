<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Verify OTP</title>
    <!-- Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts for better typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8 transition-all">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-slate-800 tracking-tight sm:text-3xl">
                OTP Verification
            </h2>
            <p class="text-sm text-slate-500 mt-2">
                Please enter the security verification code sent to your email to complete registration.
            </p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-6 space-y-2">
                    {% for category, message in messages %}
                        <div class="p-4 rounded-lg text-sm font-medium {% if category == 'error' %} bg-red-50 text-red-700 border border-red-200 {% else %} bg-amber-50 text-amber-700 border border-amber-200 {% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Verification Form -->
        <form method="POST" action="/user-verify-otp" class="space-y-5">
            
            <!-- OTP Input Group -->
            <div>
                <label for="otp" class="block text-sm font-semibold text-slate-700 mb-1.5">
                    Enter OTP
                </label>
                <input 
                    type="text" 
                    id="otp"
                    name="otp" 
                    placeholder="123456"
                    required 
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 tracking-widest text-center text-lg font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white transition"
                >
            </div>

            <!-- Password Input Group -->
            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">
                    Create Password
                </label>
                <input 
                    type="password" 
                    id="password"
                    name="password" 
                    placeholder="••••••••"
                    required 
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white transition"
                >
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-sm hover:shadow focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition active:scale-[0.99] cursor-pointer"
            >
                Verify & Register
            </button>
        </form>

    </div>

</body>
</html>
