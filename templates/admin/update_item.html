{% extends 'base.html' %}
{% block title %}Update Product | SmartCart{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto py-10 px-4 sm:px-6 lg:px-8 w-full flex-grow">
    
    <div class="mb-6">
        <a href="/admin/item-list" class="text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition flex items-center gap-1 w-fit">
            &larr; Back to Product List
        </a>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
        <div class="p-6 sm:p-8 border-b border-slate-100 bg-slate-50/50">
            <h2 class="text-xl font-bold text-slate-800 tracking-tight">Edit Product Specifications</h2>
            <p class="text-slate-400 text-xs mt-1 uppercase tracking-wider font-semibold">Product ID: #{{ product.product_id }}</p>
        </div>

        <div class="p-6 sm:p-8">
            <form method="POST" action="/admin/update-item/{{ product.product_id }}" enctype="multipart/form-data" class="space-y-5">
                
                <div>
                    <label for="name" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Product Name</label>
                    <input type="text" id="name" name="name" value="{{ product.name }}" required
                        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                </div>

                <div>
                    <label for="category" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Category</label>
                    <input type="text" id="category" name="category" value="{{ product.category }}" required
                        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                </div>

                <div>
                    <label for="price" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Price (₹)</label>
                    <input type="number" step="0.01" id="price" name="price" value="{{ product.price }}" required
                        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                </div>

                <div>
                    <label for="description" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Product Description</label>
                    <textarea id="description" name="description" rows="4" required
                        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">{{ product.description }}</textarea>
                </div>

                <div class="pt-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Product Image</label>
                    <div class="flex items-center gap-4 p-4 bg-slate-50 rounded-xl border border-slate-200">
                        <div class="w-16 h-16 bg-white rounded-lg border overflow-hidden flex items-center justify-center shrink-0">
                            <img src="/static/uploads/product_images/{{ product.image }}" alt="Current Image" class="max-w-full max-h-full object-contain">
                        </div>
                        <div class="space-y-1">
                            <input type="file" id="image" name="image" accept="image/*" class="text-xs text-slate-500">
                            <p class="text-[10px] text-slate-400">Leave empty to keep the current image file</p>
                        </div>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-100 flex justify-end">
                    <button type="submit" class="w-full sm:w-auto bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs py-3.5 px-6 rounded-xl shadow-sm transition uppercase tracking-wider cursor-pointer">
                        Save Product Changes
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
{% endblock %}
