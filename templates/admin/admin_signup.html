<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration | SmartCart</title>
    <!-- Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts for better typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen antialiased flex flex-col justify-center items-center px-4 py-12">

    <!-- Card Wrapper Container -->
    <div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-2xl shadow-xl border border-slate-800/5">
        
        <!-- Header Brand Text Structure -->
        <div class="text-center">
            <h2 class="text-2xl font-black text-slate-900 tracking-wider uppercase">SmartCart</h2>
            <h3 class="mt-2 text-xl font-bold text-slate-700 tracking-tight">Admin Registration</h3>
            <p class="mt-1.5 text-xs text-slate-400 font-medium">Initialize system administrative enrollment protocols</p>
        </div>

        <!-- Flash Alert Message Queues -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="space-y-2">
                    {% for category, message in messages %}
                        <div class="p-4 rounded-xl text-sm font-medium bg-rose-50 text-rose-700 border border-rose-100 flex items-center gap-2">
                            <span>⚠️</span>
                            <div>{{ message }}</div>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Secure Form Execution Layer -->
        <form class="mt-8 space-y-6" method="POST" action="/admin-signup">
            
            <div class="space-y-4">
                <!-- Administrative Name Input Container -->
                <div>
                    <label for="name" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Full Name</label>
                    <input 
                        type="text" 
                        id="name"
                        name="name" 
                        placeholder="John Doe"
                        required 
                        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                    >
                </div>

                <!-- Administrative Email Input Container -->
                <div>
                    <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Email Address</label>
                    <input 
                        type="email" 
                        id="email"
                        name="email" 
                        autocomplete="email"
                        placeholder="admin@smartcart.com"
                        required 
                        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                    >
                </div>
            </div>

            <!-- Submit Command Action Trigger -->
            <div>
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition-all duration-150 cursor-pointer text-center tracking-wide uppercase flex items-center justify-center gap-2">
                    <span>Send Verification OTP</span>
                    <span>&rarr;</span>
                </button>
            </div>

        </form>

        <!-- Bottom Return Utilities Link Footer -->
        <div class="text-center pt-2 border-t border-slate-100">
            <a href="/admin-login" class="text-xs font-semibold text-slate-400 hover:text-slate-600 transition">
                Already registered? Secure Log In
            </a>
        </div>

    </div>

</body>
</html>
